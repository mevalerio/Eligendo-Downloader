name: Feature request
description: Propose an improvement to the project
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: feature-type
    attributes:
      label: Feature type
      options:
        - Election source or format
        - Data normalisation
        - API endpoint
        - Export format
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Research or operational need
      description: Explain the problem and the intended use.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the desired behaviour and any relevant official source.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
