name: Bug report
description: Report reproducible incorrect behaviour
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Open Data catalogue
        - Archive import
        - HTML page parser
        - Municipal party results
        - JSON or CSV API
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Describe what happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the endpoint, parameters, election date, and source filename where relevant.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Python:
        - Eligendo API revision:
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Source provenance
      description: Provide the official URL, archive filename, and SHA-256 digest when available.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
    validations:
      required: false
